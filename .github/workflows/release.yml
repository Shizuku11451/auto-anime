name: release

# 打 tag（例如 v1.2.0）即触发：交叉编译三个平台的可执行文件、生成校验文件、
# 先验证公开镜像可拉取和启动，再公开包含 FPK 的 GitHub Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号 tag（例如 v1.2.0），需已存在于仓库'
        required: true

env:
  REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
  binaries:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum
      - name: Resolve version
        id: meta
        run: |
          TAG="$REQUESTED_TAG"
          [[ "$TAG" =~ ^v[0-9][A-Za-z0-9.+-]*$ ]] || { echo "版本标签无效"; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build binary
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          desktop_flags=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            desktop_flags="-H windowsgui -X main.desktopDefault=true"
          fi
          go build -trimpath \
            -ldflags "-s -w $desktop_flags -X main.version=${{ steps.meta.outputs.version }} -X main.commit=${{ steps.meta.outputs.commit }} -X main.buildTime=${{ steps.meta.outputs.build_time }} -X main.defaultUpdateSource=${{ github.repository }}" \
            -o "../dist/auto-anime-${{ steps.meta.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}" .
      - name: Package Windows desktop with qBittorrent
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python3 tools/package_windows.py "dist/auto-anime-${{ steps.meta.outputs.version }}-windows-amd64.exe"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-anime-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  fpk:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Resolve version
        id: meta
        run: |
          TAG="$REQUESTED_TAG"
          [[ "$TAG" =~ ^v[0-9][A-Za-z0-9.+-]*$ ]] || { echo "版本标签无效"; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Save verified x86-64 image for offline installation
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.meta.outputs.version }}"
          docker pull --platform linux/amd64 "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = amd64
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}')" = linux
          docker save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
      - name: Build bundled fnOS app package
        run: |
          export IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          export IMAGE_ARCHIVE="$RUNNER_TEMP/image.tar.gz"
          # build-fpk.sh 会下载官方 fnpack 并校验 SHA-256，再把版本号写进 manifest 与镜像标签
          chmod +x deploy/fnos/build-fpk.sh
          deploy/fnos/build-fpk.sh "${{ steps.meta.outputs.version }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-anime-fpk
          path: dist/fnos/*.fpk
          if-no-files-found: error

  release:
    needs: [binaries, fpk, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Resolve version
        id: meta
        run: |
          TAG="$REQUESTED_TAG"
          [[ "$TAG" =~ ^v[0-9][A-Za-z0-9.+-]*$ ]] || { echo "版本标签无效"; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Include third-party notices
        run: cp THIRD-PARTY-NOTICES.md dist/THIRD-PARTY-NOTICES.md
      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          # 客户端的一键更新会读取 checksums.txt 校验下载到的更新包
          sha256sum auto-anime-* > checksums.txt
          cat checksums.txt
      - name: Release notes
        run: |
          TAG="$REQUESTED_TAG"
          anchored="$(git tag -l --format='%(contents)' "$TAG")"
          if [ "${#anchored}" -ge 40 ]; then
            printf '%s\n' "$anchored" > NOTES.md
          else
            previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            {
              echo "## 变更"
              echo
              if [ -n "$previous" ]; then
                git log --no-merges --pretty='- %s' "${previous}..${TAG}"
              else
                git log --no-merges --pretty='- %s' -n 50 "${TAG}"
              fi
            } > NOTES.md
          fi
          head -n 40 NOTES.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$REQUESTED_TAG"
          gh release create "$TAG" dist/* \
            --title "Auto-Anime ${{ steps.meta.outputs.version }}" \
            --notes-file NOTES.md \
            --target "$(git rev-parse HEAD)" \
          || gh release upload "$TAG" dist/* --clobber

  image:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: meta
        run: |
          TAG="$REQUESTED_TAG"
          [[ "$TAG" =~ ^v[0-9][A-Za-z0-9.+-]*$ ]] || { echo "版本标签无效"; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # 容器镜像名必须全小写，GitHub 用户名可能含大写
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Assemble image build context
        run: |
          set -e
          rm -rf image-context
          mkdir -p image-context/static
          # 镜像使用本次已检查的构建附件，不依赖尚未公开的 Release。
          cp dist/auto-anime-${{ steps.meta.outputs.version }}-linux-amd64 image-context/
          cp dist/auto-anime-${{ steps.meta.outputs.version }}-linux-arm64 image-context/
          # static/ 内含 assets/ 子目录，必须递归复制
          cp -R backend/static/. image-context/static/
          cp scripts/docker-entrypoint.sh scripts/release.Dockerfile image-context/
          ls -R image-context | head -n 40
      - name: Build and push image (retry transient GHCR limits)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -u
          COMMIT="$(git rev-parse HEAD)"
          status=1
          for attempt in 1 2 3; do
            echo "推送 GHCR 镜像，第 ${attempt}/3 次尝试"
            if docker buildx build \
              --file image-context/release.Dockerfile \
              --platform linux/amd64,linux/arm64 \
              --push \
              --build-arg VERSION="$RELEASE_TAG" \
              --build-arg COMMIT="$COMMIT" \
              --tag "$IMAGE:$VERSION" \
              image-context; then
              docker buildx imagetools inspect "$IMAGE:$VERSION" || exit $?
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 90))
              echo "GHCR 推送失败，${delay} 秒后重试"
              sleep "$delay"
            fi
          done
          exit "$status"
      - name: Verify anonymous pull and isolated startup on both architectures
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/verify-public-image.sh "$IMAGE:$VERSION" "$VERSION"
      - name: Promote verified image to latest
        run: docker buildx imagetools create --tag '${{ steps.meta.outputs.image }}:latest' '${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}'
