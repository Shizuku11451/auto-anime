name: release

# 打 tag（例如 v1.2.0）即触发：交叉编译三个平台的可执行文件、生成校验文件、
# 创建 GitHub Release，并构建推送到 ghcr.io 的镜像（镜像内含源码前端的 static/）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号 tag（例如 v1.2.0），需已存在于仓库'
        required: true

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum
      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build binary
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.meta.outputs.version }} -X main.commit=${{ steps.meta.outputs.commit }} -X main.buildTime=${{ steps.meta.outputs.build_time }} -X main.defaultUpdateSource=${{ github.repository }}" \
            -o "../dist/auto-anime-${{ steps.meta.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}" .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-anime-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          # 客户端的一键更新会读取 checksums.txt 校验下载到的更新包
          sha256sum auto-anime-* > checksums.txt
          cat checksums.txt
      - name: Release notes
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          anchored="$(git tag -l --format='%(contents)' "$TAG")"
          if [ "${#anchored}" -ge 40 ]; then
            printf '%s\n' "$anchored" > NOTES.md
          else
            previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            {
              echo "## 变更"
              echo
              if [ -n "$previous" ]; then
                git log --no-merges --pretty='- %s' "${previous}..${TAG}"
              else
                git log --no-merges --pretty='- %s' -n 50 "${TAG}"
              fi
            } > NOTES.md
          fi
          head -n 40 NOTES.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          gh release create "$TAG" dist/* \
            --title "Auto-Anime ${{ steps.meta.outputs.version }}" \
            --notes-file NOTES.md \
            --target "${{ github.sha }}" \
          || gh release upload "$TAG" dist/* --clobber

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Assemble image build context
        run: |
          set -e
          rm -rf image-context
          mkdir -p image-context/static
          # 镜像使用的可执行文件来自本次 Release，前端产物随源码提供
          cp dist/auto-anime-${{ steps.meta.outputs.version }}-linux-amd64 image-context/
          cp dist/auto-anime-${{ steps.meta.outputs.version }}-linux-arm64 image-context/
          # static/ 内含 assets/ 子目录，必须递归复制
          cp -R backend/static/. image-context/static/
          cp scripts/docker-entrypoint.sh scripts/release.Dockerfile image-context/
          ls -R image-context | head -n 40
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: image-context
          file: image-context/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
