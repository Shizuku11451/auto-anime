# 检查官网与文档站能否构建；官网 autoanime.top 由维护者手动部署，不在此发布。
name: site
on:
  push:
    branches: ['**']
    paths:
      - 'site/**'
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'web/public/logo.svg'
      - 'web/public/favicon.svg'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'web/public/logo.svg'
      - 'web/public/favicon.svg'
      - '.github/workflows/site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
